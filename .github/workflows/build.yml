name: Build APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.5
      - name: Ekstrak zip proyek
        run: |
          mkdir -p src_extracted
          unzip -o ./*.zip -d src_extracted
          DIR=$(dirname "$(find src_extracted -name settings.gradle | head -1)")
          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"
      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: IslandCenter-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
